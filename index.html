<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chessdown - Chess x American Football</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>🏈 Chessdown ♟️</h1>
            <div id="status-bar">Loading...</div>
        </header>

        <!-- Menu Principal -->
        <div id="main-menu" class="screen active">
            <h2>Ready for the big game?</h2>
            <button id="btn-start-local" class="btn-primary">Play Local (2 Players)</button>
        </div>

        <!-- Écran de Pile ou Face -->
        <div id="coin-flip-screen" class="screen hidden" style="background: rgba(0,0,0,0.4); z-index: 100; pointer-events: none;">
            <div class="coin-container" style="margin: 0;">
                <div id="coin" class="coin">
                    <div id="coin-front" class="coin-face coin-front"></div>
                    <div id="coin-back" class="coin-face coin-back"></div>
                </div>
            </div>
            <p id="coin-text" class="hidden">Coin is flipping...</p>
        </div>

        <!-- Écran de Transition (Pass & Play) -->
        <div id="transition-screen" class="screen hidden">
            <h2 id="transition-title">Player X's Turn</h2>
            <p>Pass the device. Make sure your opponent isn't looking!</p>
            <button id="btn-ready" class="btn-primary">I'm ready</button>
        </div>

        <!-- Interface de Draft (Haut) -->
        <div id="draft-header" class="screen hidden">
            <div class="draft-header-info">
                <h3>Budget: <span id="draft-points">39</span>/39</h3>
                <div class="color-picker" id="color-picker">
                    <!-- Swatches dynamically added by JS -->
                </div>
            </div>
        </div>

        <!-- Plateau de Jeu (Affiché pendant le Draft et le Gameplay) -->
        <div id="game-layout" class="hidden">
            <div id="side-status" class="hidden">
                <div id="timer-bar-container">
                    <div id="timer-bar"></div>
                </div>
            </div>
            
            <div id="board-container">
                <div class="endzone" id="endzone-top"></div>
                <div id="chessboard"></div>
                <div class="endzone" id="endzone-bottom"></div>
            </div>
        </div>

        <!-- Interface de Draft (Bas) -->
        <div id="draft-footer" class="screen hidden">
            <div class="pieces-shop">
                <div class="shop-item" data-type="p" data-cost="1" data-icon="♟">
                    <span class="icon">♟</span> <span class="name">Pawn</span> <span class="cost">(1)</span>
                </div>
                <div class="shop-item" data-type="n" data-cost="3" data-icon="♞">
                    <span class="icon">♞</span> <span class="name">Knight</span> <span class="cost">(3)</span>
                </div>
                <div class="shop-item" data-type="b" data-cost="3" data-icon="♝">
                    <span class="icon">♝</span> <span class="name">Bishop</span> <span class="cost">(3)</span>
                </div>
                <div class="shop-item" data-type="r" data-cost="5" data-icon="♜">
                    <span class="icon">♜</span> <span class="name">Rook</span> <span class="cost">(5)</span>
                </div>
                <div class="shop-item" data-type="q" data-cost="9" data-icon="♛">
                    <span class="icon">♛</span> <span class="name">Queen</span> <span class="cost">(9)</span>
                </div>
                <div class="shop-item" data-type="k" data-cost="0" data-icon="♚" id="shop-king">
                    <span class="icon">♚</span> <span class="name">King</span> <span class="cost">(0)</span>
                </div>
            </div>
            
            <div class="draft-controls">
                <button id="btn-validate-draft" class="btn-success" disabled>Validate team</button>
                <button id="btn-clear-draft" class="btn-danger">Clear all</button>
                <button id="btn-remove-mode" class="btn-secondary">Remove Mode: OFF</button>
            </div>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="screen hidden">
            <h2 id="victory-title">Victory!</h2>
            <p id="victory-reason">Reason for victory</p>
            <div class="victory-controls" style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="btn-restart" class="btn-primary">Play Again</button>
                <button id="btn-main-menu" class="btn-secondary">Main Menu</button>
            </div>
        </div>

    </div>

    <!-- Canvas pour les confettis -->
    <canvas id="confetti-canvas"></canvas>

    <script src="confetti.js"></script>
    <script src="game.js"></script>
</body>
</html>
